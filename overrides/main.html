{% extends "base.html" %}

{% block site_logo %}
  <!-- Empty to remove any logo/icon from the top blue header -->
{% endblock %}

{% block site_nav %}
  {% if nav %}
    {% if page.meta and page.meta.hide %}
      {% set hidden = "hidden" if "navigation" in page.meta.hide %}
    {% endif %}
    <div class="md-sidebar md-sidebar--primary" data-md-component="sidebar" data-md-type="navigation" {{ hidden }}>
      <div class="md-sidebar__scrollwrap">
        <div class="md-sidebar__inner">
          <div style="padding: 10px 15px; margin-bottom: 10px; text-align: center; background-color: white; border-bottom: 1px solid #e0e0e0;">
            <img src="{{ base_url }}/assets/BAM_Logo_RGB.jpg" alt="BAM Logo" style="width: 100%; max-width: 150px; display: inline-block; padding: 5px;" />
          </div>
          {% include "partials/nav.html" %}
        </div>
      </div>
    </div>
  {% endif %}
{% endblock %}
